name: Validate Infra and React App Build

on:
  push:
    branches:
      - 'feature/**'
      - 'bug/**'
  pull_request:
    branches:
      - 'main'
      - 'development'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Restore and Build Infra
        run: |
          dotnet restore infra/src/
          dotnet build infra/src/ --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build React App
        run: |
          cd app
          npm install
          npm run build:dev
