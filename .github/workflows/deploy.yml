name: Build and Deploy Infra and React App (Multi-Env)

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Restore and Build Infra
        run: |
          dotnet restore infra/src/
          dotnet build infra/src/ --configuration Release

      - name: Upload Infra Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-build-artifacts
          path: infra/src/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build React App
        working-directory: app
        env: 
          NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          VITE_AUTH0_DOMAIN: ${{ github.ref == 'refs/heads/main' && 'authenticate.mallient.com' || 'authenticate-dev.mallient.com' }}
          VITE_AUTH0_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && 'TVUO5krYwYfQn0IuN2Lu7TckYOmzlygY' || '4ZOOXkehfkAM97g3xGT1sYXQw5WRrqq9' }}
          VITE_CARTOMAIL_CLOUDFRONT_URL: ${{ github.ref == 'refs/heads/main' && 'd2s4foqx0d4pwl.cloudfront.net/' || 'https://dnmmf3ubeuub9.cloudfront.net/' }}
          VITE_BASE_PATH: ${{ github.ref == 'refs/heads/main' && 'https://app.mallient.com' || 'http://app-dev.mallient.com' }}
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://api-live.mallient.com' || 'https://api-dev.mallient.com' }}
          VITE_AUDIENCE: ${{ github.ref == 'refs/heads/main' && 'https://api-live.mallient.com' || 'https://api-dev.mallient.com' }}
          VITE_AUTH0_CALLBACK_URL: ${{ github.ref == 'refs/heads/main' && 'https://app.mallient.com/callback' || 'http://app-dev.mallient.com/callback' }}
          VITE_NOTIFICATIONS_WS_URL: ${{ github.ref == 'refs/heads/main' && 'wss://notifications.mallient.com' || 'wss://wfxrp8nyvh.execute-api.us-east-1.amazonaws.com/dev' }}
        run: |
          npm ci
          echo "VITE_AUTH0_DOMAIN=$VITE_AUTH0_DOMAIN"
          echo "VITE_AUTH0_CLIENT_ID=$VITE_AUTH0_CLIENT_ID"
          echo "VITE_CARTOMAIL_CLOUDFRONT_URL=$VITE_CARTOMAIL_CLOUDFRONT_URL"
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          echo "VITE_AUTH0_CALLBACK_URL=$VITE_AUTH0_CALLBACK_URL"
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          npm install
          npm run build:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Upload React Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build-artifacts
          path: app/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      AWS_ACCOUNT_ID: ${{ github.ref == 'refs/heads/main' && secrets.PROD_AWS_ACCOUNT_ID || secrets.DEV_AWS_ACCOUNT_ID }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.PROD_AWS_ACCESS_KEY_ID || secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_AWS_ACCESS_DEV_KEY_SECRET || secrets.DEV_AWS_ACCESS_DEV_KEY_SECRET }}
          aws-region: us-east-1

      - name: Download Infra Artifacts
        uses: actions/download-artifact@v4
        with:
          name: infra-build-artifacts
          path: infra/src/

      - name: Download React Artifacts
        uses: actions/download-artifact@v4
        with:
          name: react-build-artifacts
          path: app/dist/

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Bootstrap AWS CDK
        run: cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: Deploy Infrastructure with CDK
        run: |
          cd infra/
          cdk deploy --all \
            --require-approval never \
            --context accountId=${{ env.AWS_ACCOUNT_ID }} \
            --context env=${{ env.ENV_NAME }}